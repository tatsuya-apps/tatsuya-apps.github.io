# ミタヨのデータを毎日作り直す（2026-11-23）
# - 日本での注目度（ウィキペディアの7日間の閲覧数）→ mitana/data/views.json
# - Netflix トップ10（日本）。新しい週が出たときだけ → mitana/data/netflix-jp.json
# - 出さない作品（グラビア・成人向けの映像。TMDB のキーワードと出ている人から）→ mitana/data/hidden.json（2026-11-24）
# - みんなのデータ（CloudKit の公開DB を数える。5人未満は出さない）→ mitana/data/community.json（2026-11-24）
# アプリはこれらを1日1回読むだけ。CloudKit の鍵は Secrets の CK_KEY_ID・CK_KEY。TMDB の鍵はリポジトリの Secrets の TMDB_KEY（ファイルには書かない）
name: mitana-data

on:
  schedule:
    - cron: "0 20 * * *" # 毎日 日本時間 5:00
  workflow_dispatch:

permissions:
  contents: write
  issues: write

concurrency:
  group: mitana-data
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 75
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Netflix トップ10（日本）
        env:
          TMDB_KEY: ${{ secrets.TMDB_KEY }}
        run: |
          curl -sSfL -o "$RUNNER_TEMP/countries.tsv" https://www.netflix.com/tudum/top10/data/all-weeks-countries.tsv
          python3 -I tools/mitana/netflix_jp.py "$RUNNER_TEMP/countries.tsv" mitana/data/netflix-jp.json --if-new

      - name: 日本での注目度
        env:
          TMDB_KEY: ${{ secrets.TMDB_KEY }}
        run: python3 -I tools/mitana/views.py mitana/data/views.json

      # 日本のジャンルの無い映画の出演者の覚え。人の名前が入るので公開のリポジトリには入れず、GitHub のキャッシュに置く（2026-11-24）
      - name: 出演者の覚えを戻す
        uses: actions/cache/restore@v4
        with:
          path: tools/mitana/jp_nogenre_cache.json
          key: jp-nogenre-${{ github.run_id }}
          restore-keys: jp-nogenre-

      - name: 出さない作品（グラビア・成人向け）
        env:
          TMDB_KEY: ${{ secrets.TMDB_KEY }}
        run: python3 -I tools/mitana/hidden.py mitana/data/hidden.json

      - name: 出演者の覚えをしまう
        if: always()
        uses: actions/cache/save@v4
        with:
          path: tools/mitana/jp_nogenre_cache.json
          key: jp-nogenre-${{ github.run_id }}

      # みんなのデータの覚え（1件ずつの記録なので公開しない。GitHub のキャッシュに置き、ふだんは変わった分だけ読む。2026-11-28）
      - name: みんなのデータの覚えを取り出す
        uses: actions/cache/restore@v4
        with:
          path: tools/mitana/community_snapshot.json
          key: community-${{ github.run_id }}
          restore-keys: community-

      - name: みんなのデータ
        env:
          CK_KEY_ID: ${{ secrets.CK_KEY_ID }}
          CK_KEY: ${{ secrets.CK_KEY }}
        run: |
          if [ -z "$CK_KEY_ID" ]; then echo "CloudKit の鍵がまだ無いので飛ばす"; exit 0; fi
          python3 -I tools/mitana/community.py mitana/data/community.json

      - name: みんなのデータの覚えをしまう
        if: always() && hashFiles('tools/mitana/community_snapshot.json') != ''
        uses: actions/cache/save@v4
        with:
          path: tools/mitana/community_snapshot.json
          key: community-${{ github.run_id }}

      - name: 変わった物を記録する
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add mitana/data tools/mitana/match_cache.json
          if git diff --cached --quiet; then
            echo "変わった物なし"
          else
            git commit -m "ミタヨのデータを更新 $(date -u +%Y-%m-%d)"
            git push
          fi

      # 止まったら Issue を作って知らせる（GitHub のメールとアプリの通知が届く。2026-11-24）
      # 同じ Issue が開いていればコメントを足すだけ。直ったら自動で閉じる
      - name: 止まったら知らせる
        if: failure() || cancelled()
        env:
          GH_TOKEN: ${{ github.token }}
          RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
        run: |
          t="ミタヨの毎朝の更新が止まりました"
          n=$(gh issue list --repo "$GITHUB_REPOSITORY" --state open --search "\"$t\" in:title" --json number -q '.[0].number')
          msg="$(TZ=Asia/Tokyo date '+%Y-%m-%d %H:%M') に失敗しました。どの手順で止まったかはここで見られます：$RUN_URL
          アプリは前の日のデータをそのまま使うので、すぐには困りません。"
          if [ -n "$n" ]; then
            gh issue comment "$n" --repo "$GITHUB_REPOSITORY" --body "$msg"
          else
            gh issue create --repo "$GITHUB_REPOSITORY" --title "$t" --body "$msg"
          fi

      - name: 直ったら知らせを閉じる
        if: success()
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          t="ミタヨの毎朝の更新が止まりました"
          for n in $(gh issue list --repo "$GITHUB_REPOSITORY" --state open --search "\"$t\" in:title" --json number -q '.[].number'); do
            gh issue close "$n" --repo "$GITHUB_REPOSITORY" --comment "$(TZ=Asia/Tokyo date '+%Y-%m-%d %H:%M') の更新はうまくいきました。"
          done
