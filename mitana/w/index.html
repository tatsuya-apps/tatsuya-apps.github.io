<!doctype html>
<html lang="ja"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>おすすめの作品 - ミタヨ</title><meta name="robots" content="noindex">
<!-- LINE などのリンクの下の見本（プレビュー）。# の後ろはプレビューを作るサーバーに届かないので、作品ごとではなく共通の文（2026-11-24 前は隠した「読み取れませんでした」の文が出ていた） -->
<meta name="description" content="友達からのおすすめの作品です。押すと作品の題名とポスターが出ます。">
<meta property="og:title" content="友達からのおすすめ - ミタヨ">
<meta property="og:description" content="押すと作品の題名とポスターが出ます。ミタヨは見た映画・ドラマ・アニメを記録する iPhone のアプリです。">
<meta property="og:image" content="https://tatsuya-apps.github.io/mitana/w/icon.png">
<meta property="og:type" content="website">
<meta name="twitter:card" content="summary">
<!-- ミタヨの「友達にすすめる」のリンクから開くページ（2026-11-23）。
     作品の情報は # の後ろ（m=movie|tv&id=TMDB の番号&t=題名&p=ポスター）。# の後ろはサーバーに送られない。
     ミタヨを入れている iPhone ではユニバーサルリンクでアプリが開く（このページは出ない）。LINE の中のブラウザなどでは開かないので「ミタヨで開く」ボタンを置く -->
<style>
:root{--bg:#faf6ef;--fg:#2a2117;--muted:#7a6a55;--line:#e8dcc8;--accent:#c98a1b;--card:#fff}
@media (prefers-color-scheme:dark){:root{--bg:#15120d;--fg:#f3ebde;--muted:#b9a88f;--line:#3a3024;--accent:#e8a93a;--card:#211b14}}
*{box-sizing:border-box}body{margin:0;background:var(--bg);color:var(--fg);font:16px/1.7 -apple-system,BlinkMacSystemFont,"Hiragino Sans",sans-serif}
main{max-width:520px;margin:0 auto;padding:28px 16px 56px}
.tag{color:var(--accent);font-weight:700;font-size:.9rem;margin:0 0 12px}
.work{display:flex;gap:16px;align-items:flex-start;background:var(--card);border:1px solid var(--line);border-radius:14px;padding:16px}
.work img{width:110px;border-radius:8px;flex-shrink:0;background:var(--line)}
h1{font-size:1.35rem;line-height:1.35;margin:0 0 6px;word-break:break-word}
.muted{color:var(--muted);font-size:.88rem}
.btn{display:block;text-align:center;background:var(--accent);color:#fff;text-decoration:none;font-weight:700;padding:14px;border-radius:999px;margin:22px 0 10px}
.sub{display:block;text-align:center;color:var(--accent);margin:8px 0}
footer{margin-top:40px;color:var(--muted);font-size:.8rem}
</style></head><body><main>
<p class="tag">友達からのおすすめ</p>
<div class="work" id="work" hidden>
  <img id="poster" alt="">
  <div><h1 id="title"></h1><p class="muted" id="kind"></p></div>
</div>
<p id="none" hidden>作品の情報が読み取れませんでした。リンクが途中で切れているかもしれません。送ってくれた人に、もう一度送ってもらってください。</p>
<a class="btn" id="open" href="#" hidden>ミタヨで開く</a>
<p class="muted" id="note" hidden>ミタヨを入れていれば、ボタンを押すと作品が開き「気になる」に入れられます。<br>ミタヨ（見た作品の記録・ランキング・サブスクの元が取れているか）は iPhone のアプリで、近日公開です。</p>
<a class="sub" id="tmdb" href="#" hidden>作品のくわしい情報（TMDB）</a>
<footer>作品の情報：TMDB（The Movie Database）。このページは TMDB が認めたものではありません。</footer>
<script>
(function(){
  var q = new URLSearchParams(location.hash.slice(1));
  var m = q.get("m"), id = q.get("id"), t = q.get("t") || "", p = q.get("p");
  if ((m !== "movie" && m !== "tv") || !/^\d+$/.test(id || "")) { document.getElementById("none").hidden = false; return; }
  document.getElementById("work").hidden = false;
  document.getElementById("title").textContent = t || "作品";
  document.title = (t ? t + " - " : "") + "ミタヨのおすすめ";
  document.getElementById("kind").textContent = m === "movie" ? "映画" : "ドラマ・アニメ";
  var img = document.getElementById("poster");
  if (p && /^\/[A-Za-z0-9_\-]+\.(jpg|png)$/.test(p)) { img.onerror = function(){ img.remove(); }; img.src = "https://image.tmdb.org/t/p/w342" + p; img.alt = t; } else { img.remove(); }
  var open = document.getElementById("open");
  open.href = "mitana://work?m=" + m + "&id=" + id; open.hidden = false;
  document.getElementById("note").hidden = false;
  var tm = document.getElementById("tmdb");
  tm.href = "https://www.themoviedb.org/" + m + "/" + id; tm.hidden = false;
})();
</script>
</main></body></html>
